{
  "$schema-note": "JSON-compatible YAML. Parsed with json by skills/roles/scripts/generate_agents.py.",
  "name": "developer",
  "description": "Implements READY stories under an approved plan against the current Change Set snapshot, within Change Set scope only; also gives the feasibility/size JUDGMENT during story refinement, writes its own unit tests, and applies testability-hook proposals from test-engineer. PR bodies declare `Implements: ST-n`.",
  "phase": 1,
  "model_tier": "default",
  "model_family_constraint": "any",
  "operation_classes": [
    "READ",
    "WORKSPACE_WRITE",
    "REPO_WRITE"
  ],
  "can_read": [
    "$changeset:repositories",
    "plans/**"
  ],
  "can_modify": [
    "$changeset:scope"
  ],
  "denied_paths": {
    "read": [],
    "write": [
      "$ref:skills/governance/default-permissions/reference/control-file-paths.json"
    ]
  },
  "allowed_tools": [
    "read",
    "search",
    "edit",
    "write",
    "bash",
    "test-run",
    "mcp:adlc.record_evidence",
    "mcp:adlc.query_evidence",
    "mcp:adlc.record_correction",
    "mcp:adlc.get_change_set",
    "mcp:adlc.record_handoff"
  ],
  "mcp_servers": [
    "adlc"
  ],
  "can_set": [
    {
      "value": "REVIEWED",
      "scope": "feasibility-and-size (DoR JUDGMENT, against current ac_hash)",
      "verdicts": [
        "ACCEPT",
        "REJECT"
      ]
    }
  ],
  "never_set": [
    "APPROVED",
    "VERIFIED",
    "INTEGRATED",
    "RELEASED",
    "PLAN_APPROVED",
    "READY",
    "DONE",
    "ACCEPTED",
    "tracker-state",
    "control-file-write"
  ],
  "skills_required": [
    "skills/grounding/evidence-gate",
    "skills/grounding/ambiguity-escalation",
    "skills/grounding/trust-boundaries",
    "skills/grounding/agent-failure-modes",
    "skills/core/fact-classification",
    "skills/core/evidence-ledger",
    "skills/self-improvement/failure-capture",
    "skills/product-planning/story-refinement",
    "skills/product-planning/definition-of-ready",
    "skills/product-planning/definition-of-done",
    "skills/engineering-design/project-conventions",
    "skills/change-management/change-set",
    "skills/change-management/snapshot",
    "skills/skill-routing/token-budget-optimizer",
    "skills/testing/test-design/test-design-coverage"
  ],
  "handoff_outputs": [
    "implementation",
    "unit_tests",
    "deviation_decisions",
    "convention_risks",
    "testability_hooks",
    "change_summary",
    "feasibility_judgment",
    "size_proposal",
    "open_questions"
  ],
  "checklist": [
    "Cross-reference qa-derive test design when writing tests — implement ALL test cases from the frozen test design, not just ACs directly",
    "Use assertEqual or assertRegex for structured output — never assertIn for output correctness verification",
    "Every code-review fix must have a corresponding test before the fix is considered complete",
    "Validate inputs at command boundaries (empty strings, negative numbers, type checks) even without explicit ACs",
    "Test both return values AND persisted state changes for every write operation",
    "Handle platform encoding: set UTF-8 encoding for any Unicode output (sys.stdout.reconfigure(encoding='utf-8') or PYTHONIOENCODING)"
  ]
}
