{
  "$schema-note": "JSON-compatible YAML. Parsed with json by skills/roles/scripts/generate_agents.py.",
  "name": "security-reviewer",
  "description": "Independent security pass over the Change Set; sets REVIEWED with ACCEPT or REJECT. A REJECT blocks within the security domain until a human lifts it. Required for HIGH/CRITICAL tiers.",
  "phase": 3,
  "model_tier": "strong",
  "model_family_constraint": "different-from-implementer-for-HIGH-CRITICAL",
  "operation_classes": [
    "READ"
  ],
  "can_read": [
    "**"
  ],
  "can_modify": [
    "docs/reviews/**",
    ".adlc/reviews/**"
  ],
  "denied_paths": {
    "read": [],
    "write": [
      "$ref:skills/governance/default-permissions/reference/control-file-paths.json"
    ]
  },
  "allowed_tools": [
    "read",
    "search",
    "bash",
    "mcp:adlc.record_evidence",
    "mcp:adlc.query_evidence",
    "mcp:adlc.record_correction",
    "mcp:adlc.get_change_set",
    "mcp:adlc.record_handoff",
    "mcp:adlc.query_incidents"
  ],
  "mcp_servers": [
    "adlc"
  ],
  "can_set": [
    {
      "value": "REVIEWED",
      "scope": "security",
      "verdicts": [
        "ACCEPT",
        "REJECT"
      ]
    }
  ],
  "never_set": [
    "APPROVED",
    "VERIFIED",
    "INTEGRATED",
    "RELEASED",
    "PLAN_APPROVED",
    "READY",
    "DONE",
    "ACCEPTED",
    "tracker-state",
    "control-file-write"
  ],
  "skills_required": [
    "skills/grounding/evidence-gate",
    "skills/grounding/ambiguity-escalation",
    "skills/grounding/trust-boundaries",
    "skills/grounding/agent-failure-modes",
    "skills/core/fact-classification",
    "skills/core/evidence-ledger",
    "skills/self-improvement/failure-capture",
    "skills/testing/security-testing/sast-scanner",
    "skills/testing/security-testing/sca-dependency-audit",
    "skills/testing/security-testing/secret-scanning",
    "skills/roles/reference/reviewer-diversity.md"
  ],
  "handoff_outputs": [
    "review_verdict",
    "security_findings"
  ],
  "checklist": [
    "Crypto algorithm review: XOR, ROT13, base64, Caesar cipher are NOT encryption — reject any project using these for security",
    "Verify parameterized queries in ALL SQL paths including ORDER BY, GROUP BY, table names, column names — not just SELECT/INSERT/UPDATE/DELETE",
    "Check platform encoding: flag cp1252/ASCII-only assumptions, verify UTF-8 BOM handling",
    "Security constant assertions: PBKDF2 iterations >= 100K, key length >= 32 bytes, algorithm not in {md5, sha1}, session TTL reasonable",
    "Check for hardcoded secrets, default credentials, and debug flags (e.g., 'or True' in conditionals)"
  ]
}
