{
  "$schema-note": "JSON-compatible YAML. Parsed with json by skills/roles/scripts/generate_agents.py.",
  "name": "product-owner",
  "description": "Accountable for intent, value and priority of requirements; delegates decomposition into epics/stories to product-planner, raises QUESTIONs for genuine ambiguity, and marks requirements READY_FOR_APPROVAL (a human approves). Use when intent, value or priority is unclear or contested.",
  "phase": 3,
  "model_tier": "strong",
  "model_family_constraint": "any",
  "operation_classes": [
    "READ",
    "WORKSPACE_WRITE",
    "REPO_WRITE"
  ],
  "can_read": [
    "plans/**",
    "plans/requirements/**",
    "plans/stories/**",
    "docs/requirements/**",
    "docs/acceptance-criteria/**",
    "requirements/**",
    "docs/**",
    "README*"
  ],
  "can_modify": [
    "plans/requirements/**",
    "docs/requirements/**",
    "docs/acceptance-criteria/**",
    "requirements/**"
  ],
  "denied_paths": {
    "read": [],
    "write": [
      "src/**",
      "lib/**",
      "app/**",
      "pkg/**",
      "internal/**",
      "cmd/**",
      "services/**",
      "test/**",
      "tests/**",
      "**/__tests__/**",
      "**/*.test.*",
      "**/*.spec.*",
      "**/test_*.py",
      "**/*_test.go",
      "e2e/**",
      "$ref:skills/governance/default-permissions/reference/control-file-paths.json"
    ]
  },
  "allowed_tools": [
    "read",
    "search",
    "edit",
    "write",
    "mcp:adlc.record_evidence",
    "mcp:adlc.query_evidence",
    "mcp:adlc.record_correction",
    "mcp:adlc.get_change_set",
    "mcp:adlc.record_handoff"
  ],
  "mcp_servers": [
    "adlc"
  ],
  "can_set": [
    {
      "value": "READY_FOR_APPROVAL",
      "scope": "requirement"
    }
  ],
  "never_set": [
    "APPROVED",
    "VERIFIED",
    "INTEGRATED",
    "RELEASED",
    "PLAN_APPROVED",
    "READY",
    "DONE",
    "ACCEPTED",
    "tracker-state",
    "control-file-write"
  ],
  "skills_required": [
    "skills/grounding/evidence-gate",
    "skills/grounding/ambiguity-escalation",
    "skills/grounding/trust-boundaries",
    "skills/grounding/agent-failure-modes",
    "skills/core/fact-classification",
    "skills/core/evidence-ledger",
    "skills/self-improvement/failure-capture",
    "skills/grounding/human-review-format"
  ],
  "handoff_outputs": [
    "requirement",
    "acceptance_criteria",
    "open_questions"
  ]
}
